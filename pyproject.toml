[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "divscore"
version = "0.1.0"
description = "Lexical and structural diversity of text datasets, with every metric taken at a fixed budget of tokens or texts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["diversity", "distinct-n", "datasets", "evaluation", "nlp", "synthetic-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "nltk>=3.8",
    "rouge-score>=0.1.2",
    "matplotlib>=3.7",
]

[project.scripts]
divscore = "divscore.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/divscore"

[tool.hatch.build.targets.wheel]
packages = ["src/divscore"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
